name: aarch64 ISO Build

# Build the aarch64 package repository and ISO on a native ARM runner.

on:
  workflow_dispatch:
    inputs:
      iso_make_args:
        description: "Extra bin/omarchy-iso-make arguments (e.g. --edge)"
        type: string
        default: ""

jobs:
  packages:
    uses: barysiuk/omarchy-pkgs/.github/workflows/build-aarch64.yml@cdd80f5bb6196e82b1adb73b64f8c7420077554f
    with:
      pkgs_repository: barysiuk/omarchy-pkgs
      pkgs_ref: cdd80f5bb6196e82b1adb73b64f8c7420077554f
      # Packages installed from the local aarch64 Omarchy repository.
      packages: >-
        omarchy-keyring ttf-jetbrains-mono-nerd-basic limine-mkinitcpio-hook limine-snapper-sync
        linux-aarch64-pkgbase-shim qcom-firmware-extract omarchy-surface-pro-12 omarchy-settings omarchy omarchy-nvim
        aether cliamp herdr localsend-bin mise-bin omacalc omacut omawrite omarchy-chromium-bin
        ttfx yay tobi-try ttf-ia-writer ufw-docker xdg-terminal-exec yaru-icon-theme
        tzupdate tensaku hyprtoolkit hyprland-guiutils hyprland hyprland-preview-share-picker

  build-iso:
    needs: packages
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 330
    env:
      ISO_MAKE_ARGS: ${{ inputs.iso_make_args }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Checkout pinned runtime
        uses: actions/checkout@v4
        with:
          repository: birkskyum/omarchy
          ref: 7efd49458113b26f4b3d49fc486889529b639070
          fetch-depth: 0
          path: sources/omarchy

      - name: Checkout pinned package recipes
        uses: actions/checkout@v4
        with:
          repository: barysiuk/omarchy-pkgs
          ref: cdd80f5bb6196e82b1adb73b64f8c7420077554f
          path: sources/omarchy-pkgs

      - name: Test integration sources
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-yaml zstd
          bash test/unit/arch-package-filter-test.sh
          bash test/unit/aarch64-initramfs-test.sh
          python3 -m unittest discover -s test/unit -p test_surface_pro_12_boot.py
          python3 -m unittest discover -s test/unit -p test_offline_mirror_pruning.py
          python3 -m unittest discover -s test/unit -p test_local_repo_config.py
          bash sources/omarchy/test/shell.d/snapdragon-hardware-test.sh
          bash sources/omarchy/test/shell.d/yoga-slim7x-hardware-test.sh
          python3 -m unittest discover -s sources/omarchy-pkgs/test

      - name: Record build sources
        run: |
          mkdir -p configs/airootfs/usr/share/omarchy-iso
          {
            echo "iso_commit=$(git rev-parse HEAD)"
            echo "runtime_commit=$(git -C sources/omarchy rev-parse HEAD)"
            echo "packages_commit=$(git -C sources/omarchy-pkgs rev-parse HEAD)"
            echo "build_run=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "purpose=Snapdragon PR integration live-USB test, not a stock release"
          } | tee configs/airootfs/usr/share/omarchy-iso/build-info

      - name: Runner facts
        run: |
          set -x
          uname -a
          nproc
          free -h
          df -h
          docker version --format '{{.Server.Version}}'
          docker info --format '{{.Driver}} {{.DockerRootDir}}'

      # The hosted runner's root disk is too small for both build stages.
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@v1.3.1
        continue-on-error: true

      - name: Disk after cleanup
        run: df -h

      - name: Download the aarch64 [omarchy] repository
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.packages.outputs.artifact }}
          path: omarchy-repo

      - name: Inspect the repository
        run: |
          test -f omarchy-repo/omarchy.db
          ls -la omarchy-repo | sed -n '1,50p'
          du -sh omarchy-repo

      - name: Build ISO
        run: |
          re='^[A-Za-z0-9 ._=/-]*$'
          [[ $ISO_MAKE_ARGS =~ $re ]] || { echo "invalid iso_make_args" >&2; exit 1; }
          start=$(date +%s)
          NO_BOOT_OFFER=1 ./bin/omarchy-iso-make --keep-pkg-cache --local-repo "$PWD/omarchy-repo" \
            --local-source "$PWD/sources/omarchy" "$PWD/sources/omarchy-pkgs" $ISO_MAKE_ARGS
          echo "ISO build wall-clock: $(( $(date +%s) - start ))s"

      - name: Inspect ISO
        run: |
          sudo apt-get install -y -qq xorriso squashfs-tools libarchive-tools >/dev/null
          ls -l release/
          for iso in release/*.iso; do
            echo "== $iso"
            sha256sum "$iso"
            xorriso -indev "$iso" -ls /EFI/BOOT/ 2>/dev/null
            xorriso -indev "$iso" -lsl /arch/boot/aarch64/ 2>/dev/null
            # The default Snapdragon boot target must carry its device trees.
            xorriso -indev "$iso" -ls /arch/boot/aarch64/omarchy-live.efi 2>/dev/null \
              || { echo "ISO is missing the DTB-carrying live UKI" >&2; exit 1; }
            xorriso -osirrox on -indev "$iso" \
              -extract /arch/boot/aarch64/omarchy-live.efi /tmp/omarchy-live.efi >/dev/null
            xorriso -osirrox on -indev "$iso" \
              -extract /arch/boot/aarch64/omarchy-surface-pro-12in-debug.efi /tmp/omarchy-surface-debug.efi >/dev/null
            python3 configs/aarch64/verify-surface-uki.py /tmp/omarchy-live.efi
            python3 configs/aarch64/verify-surface-uki.py --diagnostic /tmp/omarchy-surface-debug.efi
            # Inspect the actual airootfs/offline packages, not only recipes:
            # this catches a missing pre-finalizer dependency before upload.
            rm -rf /tmp/omarchy-iso-root /tmp/omarchy-surface-pkg /tmp/omarchy-settings-pkg /tmp/omarchy-offline-db
            xorriso -osirrox on -indev "$iso" \
              -extract /arch/aarch64/airootfs.sfs /tmp/omarchy-airootfs.sfs >/dev/null
            # Hosted runners extract as an unprivileged user. Do not attempt
            # to restore privileged filesystem xattrs (for example newgidmap),
            # which makes unsquashfs return 2 after extracting valid contents.
            unsquashfs -no-xattrs -d /tmp/omarchy-iso-root /tmp/omarchy-airootfs.sfs >/dev/null
            offline=/tmp/omarchy-iso-root/var/cache/omarchy/mirror/offline
            test -f "$offline/offline.db.tar.gz"
            mkdir -p /tmp/omarchy-offline-db /tmp/omarchy-surface-pkg /tmp/omarchy-settings-pkg
            tar -xzf "$offline/offline.db.tar.gz" -C /tmp/omarchy-offline-db
            surface_pkg=$(printf '%s\n' "$offline"/omarchy-surface-pro-12-*.pkg.tar.* | grep -v '\.sig$')
            settings_pkg=$(printf '%s\n' "$offline"/omarchy-settings-dev-*.pkg.tar.* | grep -v '\.sig$')
            test -n "$surface_pkg"; test -n "$settings_pkg"
            bsdtar -xOf "$surface_pkg" .PKGINFO | grep -Fx 'depend = snapper'
            bsdtar -xOf "$surface_pkg" .PKGINFO | grep -Fx 'depend = limine-snapper-sync'
            bsdtar -xf "$surface_pkg" -C /tmp/omarchy-surface-pkg
            bsdtar -xf "$settings_pkg" -C /tmp/omarchy-settings-pkg
            grep -Fqx 'ENABLE_UKI=yes' /tmp/omarchy-surface-pkg/etc/limine-entry-tool.d/90-omarchy-surface-pro-12.conf
            grep -Fqx 'CUSTOM_UKI_NAME=omarchy' /tmp/omarchy-surface-pkg/etc/limine-entry-tool.d/90-omarchy-surface-pro-12.conf
            grep -Fqx 'MKINITCPIO_FALLBACK=yes' /tmp/omarchy-surface-pkg/etc/limine-entry-tool.d/90-omarchy-surface-pro-12.conf
            grep -Fqx 'KERNEL_CMDLINE[default]+="initramfs_async=0 clk_ignore_unused pd_ignore_unused arm64.nopauth"' /tmp/omarchy-surface-pkg/etc/limine-entry-tool.d/90-omarchy-surface-pro-12.conf
            test -x /tmp/omarchy-surface-pkg/etc/boot/hooks/pre.d/95-omarchy-surface-pro-12
            test -f /tmp/omarchy-settings-pkg/usr/share/omarchy/default/limine/default.conf
            test -f /tmp/omarchy-settings-pkg/usr/share/omarchy/default/limine/limine.conf
            grep -Fq 'ENABLE_UKI=yes' /tmp/omarchy-iso-root/usr/share/omarchy-iso/orchestrator/phases_impl.py
            grep -Fq '_validate_surface_boot' /tmp/omarchy-iso-root/usr/share/omarchy-iso/orchestrator/phases_impl.py
          done
          df -h

      - name: Upload newly built ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: omarchy-iso-aarch64-${{ github.run_number }}
          path: ./release/*.iso
          if-no-files-found: error
          retention-days: 7
